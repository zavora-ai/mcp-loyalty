<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 460" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#d97706"/><stop offset="100%" style="stop-color:#db2777"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="750" height="460" fill="#f8fafc" rx="12"/>
  <rect x="255" y="10" width="240" height="28" rx="8" fill="url(#hg)"/>
  <text x="375" y="29" text-anchor="middle" fill="white" font-size="12" font-weight="bold">mcp-loyalty — Loyalty Program</text>

  <rect x="285" y="48" width="180" height="30" rx="8" fill="#db2777"/>
  <text x="375" y="67" text-anchor="middle" fill="white" font-size="10" font-weight="bold">MCP Client / Agent</text>
  <line x1="375" y1="78" x2="375" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- tool groups -->
  <rect x="40" y="100" width="670" height="96" rx="10" fill="white" stroke="#d97706" stroke-width="2"/>
  <rect x="40" y="100" width="670" height="22" rx="10" fill="url(#hg)"/>
  <text x="375" y="115" text-anchor="middle" fill="white" font-size="10" font-weight="bold">18 Tools</text>
  <rect x="55" y="132" width="150" height="54" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="130" y="148" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#92400e">Members (5)</text>
  <text x="130" y="163" text-anchor="middle" font-size="7" fill="#b45309">enroll · get · find</text>
  <text x="130" y="175" text-anchor="middle" font-size="7" fill="#b45309">status* · balance</text>
  <rect x="215" y="132" width="160" height="54" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="295" y="148" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#991b1b">Points (5)*</text>
  <text x="295" y="163" text-anchor="middle" font-size="7" fill="#b91c1c">earn · award · adjust</text>
  <text x="295" y="175" text-anchor="middle" font-size="7" fill="#b91c1c">expire · ledger</text>
  <rect x="385" y="132" width="170" height="54" rx="8" fill="#fdf2f8" stroke="#f9a8d4"/>
  <text x="470" y="148" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#9d174d">Rewards / Redemptions (5)</text>
  <text x="470" y="163" text-anchor="middle" font-size="7" fill="#be185d">create · list · redeem*</text>
  <text x="470" y="175" text-anchor="middle" font-size="7" fill="#be185d">redemption_status* · list</text>
  <rect x="565" y="132" width="130" height="54" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="630" y="148" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#92400e">Offers (3)</text>
  <text x="630" y="163" text-anchor="middle" font-size="7" fill="#b45309">create · list</text>
  <text x="630" y="175" text-anchor="middle" font-size="7" fill="#b45309">set_active*</text>
  <line x1="375" y1="196" x2="375" y2="214" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- ledger engine -->
  <rect x="120" y="218" width="510" height="66" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="375" y="236" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#991b1b">Points Ledger Engine (source of truth)</text>
  <text x="375" y="254" text-anchor="middle" font-size="8" fill="#b91c1c">every change → append-only entry with running balance · never negative</text>
  <text x="375" y="270" text-anchor="middle" font-size="7.5" fill="#dc2626">earn (×tier ×offer) · redeem · adjust · expire · reversal (refund on cancel)</text>
  <line x1="375" y1="284" x2="375" y2="302" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- store -->
  <rect x="100" y="306" width="550" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="375" y="324" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">LoyaltyStore (in-memory, Mutex-guarded · fictitious data)</text>
  <rect x="125" y="334" width="120" height="30" rx="6" fill="white" stroke="#93c5fd"/>
  <text x="185" y="353" text-anchor="middle" font-size="8" fill="#1e40af">members + tiers</text>
  <rect x="260" y="334" width="120" height="30" rx="6" fill="white" stroke="#93c5fd"/>
  <text x="320" y="353" text-anchor="middle" font-size="8" fill="#1e40af">ledger entries</text>
  <rect x="395" y="334" width="120" height="30" rx="6" fill="white" stroke="#93c5fd"/>
  <text x="455" y="353" text-anchor="middle" font-size="8" fill="#1e40af">rewards · redemptions</text>
  <rect x="530" y="334" width="95" height="30" rx="6" fill="white" stroke="#93c5fd"/>
  <text x="577" y="353" text-anchor="middle" font-size="8" fill="#1e40af">offers</text>

  <!-- footer -->
  <text x="375" y="392" text-anchor="middle" font-size="8" font-weight="bold" fill="#166534">Tiers: Bronze (1.0×) → Silver (1.25×) → Gold (1.5×) → Platinum (2.0×), by lifetime points</text>
  <rect x="100" y="404" width="550" height="34" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="375" y="425" text-anchor="middle" font-size="7.5" fill="#b45309">* gated points-value writes require approval in production · reads are read_only · HealthCheck + manifest</text>
</svg>
